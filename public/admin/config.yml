# =========================================================
#  Full Frame — configurazione del pannello (Sveltia CMS)
#  Gli eventi sono divisi in SEZIONI per categoria (vedi "collections").
# =========================================================

backend:
  name: github
  repo: mattiamodroni07-ai/portfolio_fotografo
  branch: claude/install-ui-ux-pro-max-ln16ke
  base_url: https://sveltia-cms-auth.mattiamodroni07.workers.dev

# Logo (bianco) e link mostrati nel pannello
logo_url: /assets/logo-fullframe.png
site_url: https://portfoliofotografo.mattiamodroni07.workers.dev
display_url: https://portfoliofotografo.mattiamodroni07.workers.dev

# Dove finiscono le foto caricate dal pannello
media_folder: "public/uploads"
public_folder: "/uploads"

# Interfaccia in italiano
locale: "it"

# Messaggi salvati nella cronologia (in italiano)
backend_commit_messages:
  create: "Aggiunto {{collection}} dal pannello"
  update: "Modificato {{collection}} dal pannello"
  delete: "Rimosso {{collection}} dal pannello"
  uploadMedia: "Caricata foto {{path}}"
  deleteMedia: "Rimossa foto {{path}}"

collections:
  - name: "portfolio"
    label: "Portfolio"
    description: "Scegli una categoria e gestisci i suoi eventi."
    editor:
      preview: false
    files:
      - name: "matrimoni"
        label: "Matrimoni"
        file: "public/content/matrimoni.json"
        format: "json"
        fields:
          - name: "eventi"
            label: "Eventi — Matrimoni"
            label_singular: "Evento"
            widget: "list"
            collapsed: true
            summary: "{{fields.nome}}"
            fields:
              - { name: "nome", label: "Nome dell'evento", widget: "string", hint: "Es. Giulia & Marco" }
              - { name: "data", label: "Data", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false, required: false }
              - { name: "luogo", label: "Luogo", widget: "string", required: false, hint: "Es. Villa Reale, Como" }
              - { name: "cover", label: "Foto di copertina", widget: "image", required: false, hint: "Facoltativa. Se la lasci vuota, viene usata la prima foto." }
              - { name: "foto", label: "Foto dell'evento", widget: "image", multiple: true, required: false, hint: "Carica o trascina le foto dal dispositivo. NON incollare indirizzi di pagine web." }
              - name: "video"
                label: "Video (link)"
                widget: "list"
                required: false
                hint: "Per i VIDEO va bene il link: incolla l'indirizzo di YouTube o Vimeo."
                field: { name: "url", label: "Link video", widget: "string" }
              - { name: "featured", label: "In evidenza in home", widget: "boolean", default: false, required: false }

      - name: "comunioni"
        label: "Prime Comunioni"
        file: "public/content/comunioni.json"
