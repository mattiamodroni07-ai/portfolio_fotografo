<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1100" viewBox="0 0 900 1100" role="img" aria-label="GIULIA &amp; MARCO - placeholder">
  <defs>
    <linearGradient id="g5" x1="0" y1="0" x2="1" y2="1" gradientTransform="rotate(30 .5 .5)">
      <stop offset="0" stop-color="#111621"/>
      <stop offset="1" stop-color="#05070c"/>
    </linearGradient>
    <radialGradient id="glow5" cx="45%" cy="50%" r="75%">
